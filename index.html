<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diplomaten gegen Saboteure</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12151c;color:#eee;font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:12px 0 24px}
h1,h2{text-align:center;margin:.5em 0}
input,button{font:inherit;border-radius:10px;border:0;padding:13px;width:100%;margin:4px 0}
input{background:#232733;color:#fff}
button{background:#363b4d;color:#fff}
button:active{filter:brightness(1.3)}
button.on{background:#2563eb}button:disabled{opacity:.4}
.go,.ja{background:#16a34a}.nein{background:#dc2626}
.sm{width:auto;padding:8px 12px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center}
.role{text-align:center;font-size:26px;font-weight:700;padding:16px;border-radius:12px;margin:8px 0}
.board{display:flex;gap:6px;margin:10px 0}
.board span{flex:1;text-align:center;background:#232733;border-radius:8px;padding:8px 2px;font-size:13px}
.p{display:flex;align-items:center;justify-content:space-between;background:#1c2029;border-radius:8px;padding:8px 10px;margin:3px 0}
.panel{background:#1c2029;border-radius:12px;padding:12px;margin:10px 0}
.priv{color:#fcd34d;font-weight:600}
.card{background:#232733;border-radius:12px;padding:12px;margin:8px 0}
.opt{background:#12151c;border-radius:8px;padding:8px;margin-top:6px;font-size:14px}
.row{display:flex;gap:8px}
.kb{width:auto;margin:0;padding:4px 10px;background:#7f1d1d}
.log div{font-size:13px;color:#999;padding:2px 0}small{color:#999}
.bd{margin:10px 0}.bl,.bf{display:flex;gap:5px;padding:6px;border-radius:10px;margin:4px 0}
.bl{background:#1e3a8a55}.bf{background:#7f1d1d55}
.sl{flex:1;height:56px;border:2px dashed #666;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
.sl i{font-style:normal;font-size:9px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.P{background:#2563eb;border:2px solid #93c5fd}.sl.E{background:#dc2626;border:2px solid #fca5a5}
#ov{position:fixed;inset:0;background:#000d;z-index:9;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;overflow:auto}
.ovb{max-width:480px;margin:0 auto}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(10,12,18,.72),rgba(10,12,18,.9)),url(/bg.jpg) center/cover no-repeat}
body.home::before{background:#12151c}
.panel,.p,.card{background:rgba(20,24,34,.84)}.board span{background:rgba(35,39,51,.86)}
.dead{opacity:.55;text-decoration:line-through}
</style></head><body><div id="app"></div>
<script>
let S=null,id=localStorage.kr_id,show=false,sel=[],info=false;
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RC={D:['Diplomat','#2563eb'],A:['Analyst','#0891b2'],S:['Saboteur','#dc2626'],T:['Tyrann','#7f1d1d']};
async function api(o){
  o.id=id;
  try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
    const j=await r.json();if(j.err)alert(j.err);return j}
  catch(e){alert('Keine Verbindung zum Server');return{}}
}
const act=(t,x)=>api({t,x});
const tg=i=>{sel=sel.includes(i)?sel.filter(k=>k!=i):sel.length<2?sel.concat(i):sel;draw()};
async function join(){
  const j=await api({t:'join',name:document.getElementById('n').value});
  if(j.id){id=j.id;localStorage.kr_id=id;connect()}
}
function connect(){
  const es=new EventSource('/events?id='+id);
  es.onmessage=e=>{S=JSON.parse(e.data);draw()};
  es.onerror=()=>{if(es.readyState==2){localStorage.removeItem('kr_id');id=null;S=null;draw()}};
}
function draw(){document.body.classList.toggle('home',!S);
  if(!S){$.innerHTML='<img src="/bg.jpg" alt="" style="width:100%;display:block;border-radius:14px;margin:8px 0 4px;box-shadow:0 6px 24px #000a"><h1>Diplomaten gegen Saboteure</h1><input id="n" maxlength="14" placeholder="Dein Name" autocomplete="off"><button class="go" onclick="join()">Beitreten</button>';return}
  const m=S.me,L=S.pl,ph=S.ph,n=L.length,nm=i=>(L.find(p=>p.id==i)||{}).name||'?',pres=esc(nm(S.pres));
  const inTeam=S.team.includes(m.id),voted=S.voted.includes(m.id);
  if(ph!='team')sel=[];
  let h='<div class="top"><b>'+esc(m.name)+'</b>'+'<span>'+(m.role?'<button class="sm" onclick="show=!show;draw()">'+(show?'Verbergen':'Rolle & Infos')+'</button> ':'')+'<button class="sm" onclick="info=true;draw()">ℹ️ Verlauf</button></span></div>';
  if(m.role&&show){
    h+='<div class="role" style="background:'+RC[m.role][1]+'">'+RC[m.role][0]+'</div>';
    h+='<div class="panel"><small>'+({D:'Wähle im Krisenteam immer den friedlichen Weg und finde die Saboteure.',A:'Du kennst die Saboteure (nicht den Tyrannen). Lenke die Diplomaten, aber verrate dich nicht – am Ende dürfen die Saboteure dich erraten.',S:'Eskaliere heimlich im Team, ohne aufzufliegen. Schütze den Tyrannen.',T:'Du führst die Saboteure an. Sie kennen dich, du kennst sie nicht. Fall nicht auf!'})[m.role]+'</small></div>';
    if(m.role=='S')h+='<div class="panel">Deine Leute: <b>'+L.filter(p=>(p.role=='S'||p.role=='T')&&p.id!=m.id).map(p=>esc(p.name)+(p.role=='T'?' (Tyrann)':'')).join(', ')+'</b></div>';
    if(m.role=='A')h+='<div class="panel">Die Saboteure (ohne Tyrann): <b>'+L.filter(p=>p.role=='S'&&p.id!=m.id).map(p=>esc(p.name)).join(', ')+'</b></div>';
    if(S.priv.length)h+='<div class="panel priv">'+S.priv.map(esc).join('<br>')+'</div>';
  }
  const ns=[0,0,0,0,0,2,2,3,3,4,4][n]||0;
  const row=(e,ic,cl,N,em)=>{const l=S.hist.filter(x=>x.e==e);let r='';for(let i=0;i<N;i++)r+='<div class="sl'+(l[i]?' '+cl:'')+'">'+(l[i]?ic+'<i>'+esc(l[i].t.split(' ')[0])+'</i>':(em[i]||''))+'</div>';return r};
  h+='<div class="bd"><div class="bl">'+row(false,'🕊️','P',8,{7:'🏆'})+'</div><div class="bf">'+row(true,'🔥','E',8,{2:'⚖️',3:'💀',7:'☠️'})+'</div></div>';
  h+='<div class="board"><span>🕊️ noch '+(8-S.sol)+' bis Frieden</span><span>🔥 noch '+(8-S.esc)+' bis Eskalation</span></div>';
  if(n>=5)h+='<div class="board"><span>😈 Zu Beginn: '+ns+' Saboteure (inkl. Tyrann)</span><span>🕊️ '+(n-ns)+' Diplomaten</span></div>';
  h+=L.map(p=>'<div class="p'+(p.dead?' dead':'')+'"><span>'+(p.dead?'💀 ':'')+esc(p.name)+(p.bot?' 🤖':'')+(p.id==S.pres&&ph!='lobby'?' 🎩':'')+(S.team.includes(p.id)?' 👥':'')+(p.on?'':' ⚠️')+((p.role&&(ph=='over'||p.dead))?' <small>['+RC[p.role][0]+']</small>':'')+'</span>'+((m.host&&ph=='lobby'&&p.id!=m.id)?'<button class="kb" onclick="act(\'kick\',\''+p.id+'\')">✕</button>':'')+'</div>').join('');
  let s='',c=S.card;
  const cardH=c?'<div class="card"><b>'+esc(c.t)+'</b><p>'+esc(c.s)+'</p>'+c.o.map(o=>'<div class="opt"><b>'+(o.k=='P'?'🕊️ Friedlicher Weg:':'🔥 Eskalationsrisiko:')+'</b> '+esc(o.x)+'</div>').join('')+'</div>':'';
  const lvH=S.lv?'<small>Letzte Teamwahl: '+S.lv.map(x=>esc(x[0])+(x[1]?' ✅':' ❌')).join(', ')+'</small>':'';
  const yn=(t)=>!m.alive?'<p>💀 Du bist tot – du schaust zu.</p>':voted?'<p>Warten… '+S.voted.length+'/'+L.filter(p=>!p.dead).length+' abgestimmt</p>':'<div class="row"><button class="ja" onclick="act(\''+t+'\',true)">JA</button><button class="nein" onclick="act(\''+t+'\',false)">NEIN</button></div>';
  if(ph=='lobby'){
    s='<p>'+n+'/10 Spieler (mind. 5)</p>'+(m.host?'<button class="go" onclick="act(\'start\')">Spiel starten</button>':'<p>Warte auf den Host…</p>');
    // TESTMODUS-BEGIN
    if(m.host)s+='<p><small>Testmodus:</small></p><div class="row"><button onclick="act(\'bot\')">+ Bot</button><button onclick="act(\'fill\')">Auf 7 füllen</button></div>';
    // TESTMODUS-END
  }else if(ph=='team'){
    s=cardH+(S.rej?'<p>'+lvH+'<br><small>Abgelehnte Teams: '+S.rej+'/3 – bei 3 eskaliert die Krise.</small></p>':'')+(m.id==S.pres?'<p>Du bist Vorsitz und automatisch im Team. Wähle 2 weitere Mitglieder ('+sel.length+'/2):</p>'+L.filter(p=>!p.dead&&p.id!=m.id).map(p=>'<button class="'+(sel.includes(p.id)?'on':'')+'" onclick="tg(\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+'<button class="go" '+(sel.length==2?'':'disabled')+' onclick="act(\'team\',sel)">Team bestätigen</button>':'<p>'+pres+' stellt das Krisenteam zusammen…</p>')+((S.acc||!m.alive)?'':S.esc<3?'<small>⚖️ Anklage möglich ab 3 Eskalationen</small>':'<button onclick="act(\'acc\')">⚖️ Anklage beantragen (1× pro Spiel)</button>');
  }else if(ph=='tvote'){
    s=cardH+'<p>Vorsitz <b>'+pres+'</b> schlägt vor: <b>'+S.team.map(i=>esc(nm(i))).join(', ')+'</b></p><p><small>Redet offen: Vertraut ihr diesem Team?</small></p>'+yn('tv');
  }else if(ph=='vote'){
    s=cardH+'<p>Team: <b>'+S.team.map(i=>esc(nm(i))).join(', ')+'</b></p>'+lvH+(inTeam&&!voted?'<p>Heimliche Wahl:</p><div class="row"><button class="go" onclick="act(\'cv\',\'P\')">🕊️ Friedlich</button><button class="nein" onclick="act(\'cv\',\'E\')">🔥 Eskalieren</button></div>':'<p>Das Team wählt heimlich… '+S.voted.length+'/3</p>');
  }else if(ph=='result'||(ph=='over'&&S.res)){
    s=(S.res?'<h2>'+(S.res.esc?'🔥 Eskaliert':'🕊️ Gelöst')+'</h2><p>'+(S.res.forced?'Dreimal kein Team – die Krise eskaliert von selbst.':S.res.ne+'× Eskalation, '+S.res.np+'× friedlich (nicht sichtbar, von wem)')+'</p>':'')+((ph=='result'&&m.id==S.pres)?'<button class="go" onclick="act(\'next\')">Nächste Runde</button>':ph=='result'?'<p>Warte auf '+pres+'…</p>':'');
  }
  if(ph=='avote')s='<p>⚖️ '+(S.vq=='hold'?esc(nm(S.asker))+' beantragt eine Anklage. Durchführen?':'Anklage gegen <b>'+esc(nm(S.asp))+'</b>. Wirklich anklagen?')+'</p>'+yn('av');
  if(ph=='apick')s=m.id==S.asker?'<p>Wen klagst du als Tyrann an?</p>'+L.filter(p=>p.id!=m.id).map(p=>'<button onclick="act(\'ap\',\''+p.id+'\')">'+esc(p.name)+'</button>').join(''):'<p>'+esc(nm(S.asker))+' wählt einen Verdächtigen…</p>';
  if(ph=='kill')s=m.id==S.pres?'<p>☠️ Stufe 4: Du darfst einen Spieler töten. Seine Rolle wird danach aufgedeckt.</p>'+L.filter(p=>!p.dead&&p.id!=m.id).map(p=>'<button class="nein" onclick="act(\'ki\',\''+p.id+'\')">'+esc(p.name)+'</button>').join(''):'<p>☠️ '+pres+' entscheidet über Leben und Tod…</p>';
  if(ph=='night')s=!m.alive?'<p>💀 Du bist tot – du schaust zu.</p>':voted?'<p>🌙 Warten… '+S.voted.length+'/'+L.filter(p=>!p.dead).length+'</p>':'<p>🌙 <b>Nacht.</b> Alle Handys zeigen dasselbe. Tippe einen Spieler an. <small>(Nur die Wahl der Saboteure zählt.)</small></p>'+L.filter(p=>!p.dead&&p.id!=m.id).map(p=>'<button onclick="act(\'nv\',\''+p.id+'\')">'+esc(p.name)+'</button>').join('');
  if(ph=='guess')s=!m.alive?'<p>💀 Du bist tot – du schaust zu.</p>':voted?'<p>🎯 Warten… '+S.voted.length+'/'+L.filter(p=>!p.dead).length+'</p>':'<p>🎯 <b>Letzte Chance der Saboteure.</b> Alle Handys zeigen dasselbe. Tippe, wer der Analyst sein könnte. <small>(Nur die Wahl der Saboteure zählt.)</small></p>'+L.filter(p=>!p.dead&&p.id!=m.id).map(p=>'<button onclick="act(\'nv\',\''+p.id+'\')">'+esc(p.name)+'</button>').join('');
  if(ph=='over')s+='<h2>'+(S.win=='D'?'🕊️ Diplomaten gewinnen':'😈 Saboteure gewinnen')+'</h2><p>'+esc(S.why)+'</p>'+(m.host?'<button class="go" onclick="act(\'new\')">Neues Spiel (Lobby)</button>':'');
  if(m.host&&ph!='lobby'&&ph!='over')s+='<button onclick="if(confirm(\'Spiel abbrechen und zurück zur Lobby?\'))act(\'new\')">Spiel neu starten (Host)</button>';
  h+='<div class="panel">'+s+'</div>';
  if(info)h+='<div id="ov"><div class="ovb"><div class="top"><b>Verlauf</b><button class="sm" onclick="info=false;draw()">✕ Schließen</button></div><div class="panel"><b>Krisen bisher</b>'+(S.hist.length?S.hist.map((x,i)=>'<div>'+(i+1)+'. '+(x.e?'🔥':'🕊️')+' '+esc(x.t)+' – '+(x.e?'eskaliert':'gelöst')+'</div>').join(''):'<div><small>Noch keine Krise.</small></div>')+'</div><div class="panel log"><b>Ereignisse</b>'+S.log.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div></div></div>';
  $.innerHTML=h;
}
if(id)connect();else draw();
</script></body></html>
